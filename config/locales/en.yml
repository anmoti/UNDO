# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
    hello: "Hello world"

    flash:
        users:
            created: "Your account has been successfully created."
            updated: "User information has been updated."
            destroyed: "User has been deleted."
        reviews:
            created: "Review has been posted."
            updated: "Review has been updated."
            destroyed: "Review has been deleted."
            company_restriction: "Corporate accounts cannot post reviews."
        sessions:
            signed_in: "Signed in successfully."
            signed_out: "Signed out successfully."
            invalid_credentials: "Email or password is incorrect."
        errors:
            generic: "An error has occurred."
            not_found: "The specified resource could not be found."
            unauthorized: "You do not have permission to perform this action."

    activerecord:
        models:
            user: "User"
            review: "Review"
            store: "Store"
            session: "Session"
        attributes:
            user:
                name: "Name"
                email: "Email"
                password: "Password"
                password_confirmation: "Password confirmation"
                is_company: "Corporate account"
            review:
                rating: "Rating"
                comment: "Comment"
                reviewer: "Reviewer"
                reviewee: "Reviewee store"
            store:
                name: "Store name"
                latitude: "Latitude"
                longitude: "Longitude"
